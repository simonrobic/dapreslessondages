# SPDX-License-Identifier: AGPL-3.0-or-later
# Mise à jour toutes les 3 heures : récupère les sondages, recalcule, publie sur GitHub Pages.
name: Mise à jour du site
on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 heures (GitHub peut retarder chaque passage)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Polices de l'image de partage
        run: sudo apt-get install -y -q fonts-dejavu-core || true
      - name: Environnement Python
        run: uv venv --python 3.13 && uv pip install -r pyproject.toml
      - name: Sondages 2027
        run: .venv/bin/python scripts/fetch_2027.py
      - name: Garder les données dans le dépôt
        run: |
          git config user.name "dapreslessondages-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/polls/2027.json data/raw/wikipedia-2027.json
          git diff --cached --quiet || git commit -m "Sondages 2027 : mise à jour automatique" && git push
      - name: Prévisions et site
        run: .venv/bin/python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
